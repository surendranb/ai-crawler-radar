[project]
name = "ai-crawler-radar"
version = "0.1.0"
description = "Autonomous AI Search, Training & Agent Crawler Diagnostic Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Surendran B", email = "reachsuren@gmail.com" }]
keywords = ["mcp", "ai-crawler", "llms-txt", "robots-txt", "turnstile", "waf", "cloudflare-radar", "searchgpt", "perplexity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.0.0,<3",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
publish = [
  "build>=1.2.2",
  "twine>=5.1.1",
]

[project.urls]
Homepage = "https://github.com/surendranb/ai-crawler-radar"
Repository = "https://github.com/surendranb/ai-crawler-radar"
Issues = "https://github.com/surendranb/ai-crawler-radar/issues"

[project.scripts]
ai-crawler-radar = "ai_crawler_radar.cli:main"
ai-crawler-radar-mcp = "ai_crawler_radar.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_crawler_radar = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
